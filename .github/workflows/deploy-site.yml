name: Deploy Site to Netlify

# Fast manual deploy of deploy_netlify/ — does NOT regenerate RSS feeds.
# Use when the transcripts viewer (or any static content) needs publishing
# without waiting for the full RSS update workflow (whose per-lecture
# audio-size HEAD requests can take a very long time).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: feature/rss-ui

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        env:
NETLIFY_AUTH_TOKEN: <redacted>
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: netlify deploy --prod --dir="deploy_netlify" --site="${{ secrets.NETLIFY_SITE_ID }}"
